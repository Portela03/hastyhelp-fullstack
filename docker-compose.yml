services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hastyhelp
      POSTGRES_PASSWORD: hastyhelp
      POSTGRES_DB: hastyhelp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hastyhelp"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://hastyhelp:hastyhelp@db:5432/hastyhelp
      JWT_SECRET: troque-em-producao
      PORT: 3333
      SEED: "true"
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
